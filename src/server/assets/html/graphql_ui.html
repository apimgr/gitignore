{{define "content"}}
<div class="container container-lg">
<header class="page-header"><h1 class="page-title">{{t .Lang "help.graphql_description"}}</h1><p class="page-lead">{{t .Lang "graphql.description"}}</p></header>
<section class="section-card" aria-labelledby="graphql-explorer"><h2 id="graphql-explorer">{{t .Lang "graphql.docs"}}</h2><div id="graphiql" data-graphql-url="{{.Data.endpoint}}" data-control-label="{{t .Lang "graphql.control_label"}}"></div></section>
<noscript><section class="section-card" aria-labelledby="graphql-no-js"><h2 id="graphql-no-js">{{t .Lang "graphql.docs"}}</h2><p>{{t .Lang "graphql.no_js"}}</p><a href="{{.Data.endpoint}}">{{t .Lang "graphql.open_get"}}</a></section></noscript>
</div>
{{end}}
