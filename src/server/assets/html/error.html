{{define "content"}}
<div class="container container-sm">
<header class="page-header"><h1 class="page-title">{{.Data.status}}</h1><p class="page-lead">{{.Data.code}}</p></header>
<section class="section-card error-page" aria-labelledby="error-details">
<h2 id="error-details">{{t .Lang "common.details"}}</h2>
<p>{{.Data.message}}</p>
<a class="btn" href="{{path "/"}}">Go Home</a>
</section>
</div>
{{end}}
