# Development Docker Compose - HUMAN USE ONLY
# Persistent development data under ./volumes; container port is always 80.

name: gitignore

x-logging: &default-logging
  options:
    max-size: "5m"
    max-file: "1"
  driver: json-file

services:
  gitignore:
    image: ghcr.io/apimgr/gitignore:devel
    container_name: gitignore-app
    hostname: gitignore
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PORT: 80
      DEBUG: true
      MODE: development
      TZ: ${TZ:-America/New_York}
      CONFIG_DIR: /config/gitignore
      DATA_DIR: /data/gitignore
    volumes:
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z
    ports:
      - "64580:80"
    healthcheck:
      test: ["CMD", "/usr/local/bin/gitignore", "--status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
    networks:
      - gitignore

networks:
  gitignore:
    name: gitignore
    external: false
