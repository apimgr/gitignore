{{define "content"}}
<h1>{{t .Lang "common.search"}}</h1>
<form action="{{path "/search"}}" method="get">
<input type="text" name="q" value="{{.Data.query}}" placeholder="{{t .Lang "web.home.search_placeholder"}}" aria-label="{{t .Lang "common.search"}}">
<button type="submit">{{t .Lang "common.search"}}</button>
</form>
{{if .Data.query}}
<p>{{tf .Lang "web.search.results" "count" (len .Data.results) "query" .Data.query}}</p>
<ul class="templates">
{{range .Data.results}}<li><a href="{{path (printf "/template/%s" .Name)}}">{{.Name}}</a></li>{{end}}
</ul>
{{end}}
{{end}}
