# Production Docker Compose - HUMAN USE ONLY
# Persistent storage under ./volumes; container internal port is always 80.
# Copy this file to a deployment directory before starting the service.

name: gitignore

x-logging: &default-logging
  options:
    max-size: "5m"
    max-file: "1"
  driver: json-file

services:
  gitignore:
    image: ghcr.io/apimgr/gitignore:latest
    container_name: gitignore-app
    hostname: gitignore
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      PORT: 80
      TZ: ${TZ:-America/New_York}
      ADDRESS: 0.0.0.0
      CONFIG_DIR: /config/gitignore
      DATA_DIR: /data/gitignore
    volumes:
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z
    ports:
      - "172.17.0.1:64180:80"
    healthcheck:
      test: ["CMD", "/usr/local/bin/gitignore", "--status"]
      interval: 10s
      timeout: 15s
      retries: 3
      start_period: 10m
    networks:
      - gitignore

networks:
  gitignore:
    name: gitignore
    external: false
    driver: bridge
