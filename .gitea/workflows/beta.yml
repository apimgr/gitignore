name: Beta Release

on:
  push:
    tags:
      - '*-beta'
  workflow_dispatch:

concurrency:
  group: beta-${{ gitea.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_NAME: gitignore
  INTERNAL_NAME: gitignore

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.set.outputs.version }}
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Compute beta version
        id: set
        run: |
          if [[ "${GITEA_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITEA_REF_NAME}" =~ ^[0-9]{14}-beta$ ]]; then
              echo "ERROR: beta tags must use YYYYMMDDHHMMSS-beta" >&2
              exit 1
            fi
            STAMP="${GITEA_REF_NAME%-beta}"
          else
            STAMP="$(date -u +%Y%m%d%H%M%S)"
          fi
          echo "version=${STAMP}-beta" >> "$GITEA_OUTPUT"
          echo "tag=${STAMP}-beta" >> "$GITEA_OUTPUT"

  build:
    needs: [version]
    runs-on: ubuntu-26.04
    container:
      image: casjaysdev/go:latest
      options: "--user 0:0"
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: arm64

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set build info
        run: |
          echo "VERSION=${{ needs.version.outputs.version }}" >> "$GITEA_ENV"
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> "$GITEA_ENV"
          BUILD_EPOCH=$(date -u +%s)
          echo "BUILD_EPOCH=${BUILD_EPOCH}" >> "$GITEA_ENV"
          echo "BUILD_DATE=$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITEA_ENV"
          if [ -f site.txt ]; then
            echo "OFFICIAL_SITE=$(cat site.txt)" >> "$GITEA_ENV"
          else
            echo "OFFICIAL_SITE=${{ secrets.OFFICIAL_SITE }}" >> "$GITEA_ENV"
          fi

      - name: Build server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildEpoch=${{ env.BUILD_EPOCH }}' -X 'main.OfficialSite=${{ env.OFFICIAL_SITE }}'"
          go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./src

      - name: Build CLI
        if: hashFiles('src/client/') != ''
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildEpoch=${{ env.BUILD_EPOCH }}' -X 'main.OfficialSite=${{ env.OFFICIAL_SITE }}'"
          go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o ${{ env.PROJECT_NAME }}-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./src/client

      - name: Upload server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.PROJECT_NAME }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 30

      - name: Upload CLI artifact
        if: hashFiles('src/client/') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ env.PROJECT_NAME }}-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.PROJECT_NAME }}-cli-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          retention-days: 30

  release:
    needs: [version, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: binaries
          merge-multiple: true

      - name: Set version
        run: |
          echo "VERSION=${{ needs.version.outputs.version }}" >> "$GITEA_ENV"

      - name: Create version.txt
        run: echo "${{ env.VERSION }}" > binaries/version.txt

      - name: Create source archive
        run: tar --exclude='.git' --exclude='.github' --exclude='.gitea' --exclude='.forgejo' --exclude='binaries' --exclude='releases' --exclude='*.tar.gz' -czf "binaries/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-source.tar.gz" .

      - name: Generate SBOM (CycloneDX)
        run: docker run --rm -v "$PWD:/app" -w /app -e GOFLAGS=-buildvcs=false casjaysdev/go:latest cyclonedx-gomod mod -json -output "binaries/${{ env.PROJECT_NAME }}-${{ env.VERSION }}-sbom.cdx.json"

      - name: Create checksums
        run: |
          cd binaries
          FILES=$(find . -maxdepth 1 -type f ! -name sha256.txt ! -name sha512.txt -printf '%f\n' | sort)
          printf '%s\n' "$FILES" | xargs sha256sum > sha256.txt
          printf '%s\n' "$FILES" | xargs sha512sum > sha512.txt

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ env.VERSION }}
          files: binaries/*
          prerelease: true
          token: ${{ secrets.GITEA_TOKEN }}
