{{define "content"}}
<div class="container container-md">
  <header class="page-header">
    <h1 class="page-title">{{t .Lang "terms.title"}}</h1>
    <p class="page-lead">{{t .Lang "terms.description"}}</p>
  </header>
  <section class="section-card" aria-labelledby="terms-content-title">
    <h2 id="terms-content-title">{{t .Lang "terms.content"}}</h2>
    <div class="terms-content">{{.Data.content}}</div>
  </section>
</div>
{{end}}
