# Test Docker Compose - AI/AUTOMATED TESTING ONLY
# Copy this file to an isolated project-scoped OS temporary directory first.

name: gitignore

x-logging: &default-logging
  options:
    max-size: "5m"
    max-file: "1"
  driver: json-file

services:
  gitignore:
    image: ghcr.io/apimgr/gitignore:devel
    pull_policy: always
    container_name: gitignore-app
    hostname: gitignore
    restart: "no"
    logging: *default-logging
    environment:
      PORT: 80
      DEBUG: true
      MODE: development
      TZ: ${TZ:-America/New_York}
      ADDRESS: 0.0.0.0
      CONFIG_DIR: /config/gitignore
      DATA_DIR: /data/gitignore
    volumes:
      - ./volumes/config:/config:z
      - ./volumes/data:/data:z
    ports:
      - "172.17.0.1:64181:80"
    healthcheck:
      test: ["CMD", "/usr/local/bin/gitignore", "--status"]
      interval: 10s
      timeout: 15s
      retries: 3
      start_period: 90s
    networks:
      - gitignore

networks:
  gitignore:
    name: gitignore-test
    external: false
    driver: bridge
